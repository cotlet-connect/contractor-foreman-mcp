[project]
name = "contractor-foreman-mcp"
version = "1.1.0"
description = "Connect Contractor Foreman to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Contractor Foreman API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["contractor foreman", "contractor foreman api", "contractor foreman mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/contractor-foreman-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=contractor-foreman"
Source = "https://github.com/cotlet-connect/contractor-foreman-mcp"

[project.scripts]
contractor-foreman-mcp = "contractor_foreman_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"contractor_foreman_agent.py" = "contractor_foreman_agent.py"

[tool.hatch.build.targets.sdist]
include = ["contractor_foreman_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
